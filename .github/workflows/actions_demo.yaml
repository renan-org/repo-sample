name: My demo
on:
#  push:
#    branches: 
#      - "main**"
#      - "master**"
#  pull_request:
#    branches: 
#      - "main"
  workflow_dispatch:
    inputs:
      environment-renan:
        description: Dummy env var
        type: environment
        required: true
#  schedule:
#    - cron: "15 6 * * 0"

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Display Event
        run: |
          echo "${{ github.event_name }}"

      - name: name of the branch
        run: echo "${{ github.ref }}"

      - name: List all files in the repository
        run: tree

  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: demo
    environment: Test
    steps:
      - name: Dummy echo
        run: echo "🧪 Testing..."

      - name: Adding markdown
        run: echo '### Hello world! 🚀' >> $GITHUB_STEP_SUMMARY

  Load-test:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: demo
    environment: Load-Test
    steps:
      - run: |
          echo "🧪 Testing..."
          sleep 15
      - name: Adding markdown
        run: echo '### Hello world! 🚀' >> $GITHUB_STEP_SUMMARY


  Production:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    needs: demo
    environment: Production
    steps:
      - run: |
          echo "🚀 Step 1..."
          sleep 10
      - run: |
          echo "🚀 Step 2..."
          sleep 10
      - run: |
          echo "🚀 Step 3..."
          sleep 10
      - run: |
          echo "🚀 Step 4..."
          sleep 10
      - run: |
          echo "🚀 Step 5..."
          sleep 10
  
      - name: Adding markdown
        run: echo '### Hello world! 🚀' >> $GITHUB_STEP_SUMMARY
